<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCKH · Agenda nhóm</title>
<style>
:root{
  --paper:#F6F4EE;--card:#FFFFFF;--ink:#1D2230;--muted:#5C6170;--line:#D9D4C7;--soft:#EFEBE0;--hover:#F1EEE6;
  --acc:#2F43C8;--accsoft:#E4E8FB;--ok:#2C7A4B;--bad:#A8324A;
  --body:"Times New Roman",Times,"Liberation Serif",serif;--head:"Times New Roman",Times,"Liberation Serif",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100vh}
h1,h2,h3,h4,.h{font-family:var(--body);font-weight:700;letter-spacing:0;margin:0;line-height:1.2}
button,input,select,textarea{font-family:var(--body);font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:15px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.mt{margin-top:20px}.hide{display:none!important}
/* thanh trên */
.bar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:20px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;white-space:nowrap}
.brand i{display:inline-block;width:14px;height:14px;background:var(--ink);border-radius:3px;transform:rotate(45deg)}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:0 16px;font-size:17px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}
.dotb{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;font-size:13px;padding:0 7px;margin-left:6px;font-family:var(--head)}
.iconbtn{border:0;background:transparent;width:44px;align-self:center;height:44px;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--hover)}
.iconbtn b{position:absolute;top:2px;right:2px;background:var(--acc);color:#fff;border-radius:999px;min-width:19px;height:19px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-family:var(--head)}
.userchip{align-self:center;border:1px solid var(--line);background:var(--card);padding:5px 12px 5px 6px;border-radius:999px;display:flex;gap:8px;align-items:center;min-height:44px}
/* thành phần */
.ini{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-family:var(--head);font-weight:700;font-size:11.5px;flex:0 0 auto}
.av{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;font-size:15px;white-space:nowrap}
.av .ini{width:24px;height:24px;font-size:10.5px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 10px;border-radius:999px;font-size:14.5px;white-space:nowrap}
.flag{display:inline-block;padding:0 8px;border-radius:5px;font-size:13.5px;border:1px solid}
.f-c{background:#FFF4D1;color:#6a5100;border-color:#E6CF86}.f-p{background:#ECE6F8;color:#4b3a85;border-color:#CABFE8}.f-t{background:#FBE7DA;color:#8a4219;border-color:#EFC7AB}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:8px;min-height:42px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{color:var(--bad);border-color:#DDB3BE}
.btn.sm{padding:4px 12px;min-height:36px;font-size:15.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=url],input[type=date],input[type=password],textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:76px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:0 0 auto;margin-top:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;min-height:38px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.over{color:var(--bad);font-weight:700}
.sh{font-size:26px;margin:34px 0 10px}
.pbar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.tip{background:var(--accsoft);border-radius:8px;padding:12px 16px}
/* tổng quan */
.top1{padding:30px 0 6px}
.top1 h1{font-size:clamp(27px,3.4vw,40px);max-width:920px}
.chs{display:flex;gap:0;margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.chs button{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 12px 10px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:4px}
.chs button:last-child{border-right:0}
.chs button:hover{background:var(--hover)}
.chs .n{font-family:var(--head);font-weight:700;font-size:13.5px;color:var(--muted)}
.chs .t{font-family:var(--head);font-weight:700;font-size:15px;line-height:1.2}
.milestones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);margin-top:14px}
.milestones div{padding:12px 12px 0 0;position:relative}
.milestones div::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.milestones b{display:block;font-family:var(--head);font-size:15.5px;margin-top:6px}
/* thẻ việc */
.tc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;border-left:5px solid var(--st)}
.tc:hover{background:var(--hover)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:5px;font-size:15px;color:var(--muted)}
/* khung lý thuyết */
.fw{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:16px}
.fw>button.fh{width:100%;display:flex;align-items:center;gap:12px;padding:14px 18px;border:0;background:transparent;text-align:left}
.fw .body{display:none;padding:0 18px 18px}.fw.open .body{display:block}
.chev{width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;margin:0 4px}
.open>button .chev,.open>.fh .chev{transform:rotate(45deg)}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:4px}
.map div{padding:8px 12px 8px 0;font-size:15.5px;position:relative}
.map b{display:block;font-family:var(--head);font-size:15px}
.map div:not(:last-child)::after{content:"";position:absolute;right:6px;top:14px;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg)}
.pil{border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:6px;min-height:150px}
.pil:hover{border-color:var(--ink)}
.pil .k{font-family:var(--head);font-weight:800;font-size:13.5px;color:var(--acc)}
.pil .q{font-size:16px;color:var(--muted)}
/* bảng kéo thả */
.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kcol{background:var(--soft);border-radius:10px;padding:10px;min-height:200px;max-height:max(420px,calc(100vh - 250px));overflow-y:auto;border:2px solid transparent}
.kcol.over{border-color:var(--acc);background:var(--accsoft)}
.kcol h4{display:flex;justify-content:space-between;font-size:14.5px;margin:2px 4px 10px;text-transform:none}
.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 12px;margin-bottom:8px;cursor:grab;position:relative;user-select:none;-webkit-user-select:none;touch-action:pan-y;border-left:4px solid var(--st)}
.kc:hover{border-color:var(--ink);border-left-color:var(--st)}
.kc.dragging{opacity:.35}
.kc .cd{font-family:var(--head);font-weight:700;font-size:13px;color:var(--muted)}
.kc .tt{font-size:16px;line-height:1.3;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kc .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.grip{position:absolute;right:4px;top:4px;width:24px;height:24px;touch-action:none;cursor:grab;background:radial-gradient(circle,var(--muted) 1.4px,transparent 1.6px) 0 0/8px 8px;opacity:.5;border-radius:4px}
.ghost{position:fixed;z-index:100;pointer-events:none;width:210px;box-shadow:0 14px 30px rgba(0,0,0,.25);transform:rotate(2deg);opacity:.95}
/* theo chương */
.chap{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.chap>button{display:flex;width:100%;gap:14px;align-items:center;padding:14px 18px;border:0;background:transparent;text-align:left}
.chap .cb{display:none;padding:0 12px 10px}.chap.open .cb{display:block}
.it{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 56px 150px 120px;gap:10px;align-items:center;padding:11px 8px;border:0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:transparent;text-align:left}
.it:hover{background:var(--hover)}
.it .cdx{font-weight:700;font-size:16px}
.ithead{display:grid;grid-template-columns:62px minmax(0,1fr) 150px 56px 150px 120px;gap:10px;padding:4px 8px;font-size:14px;color:var(--muted)}
/* ngăn kéo chi tiết */
.ov{position:fixed;inset:0;background:rgba(20,22,32,.42);z-index:60;display:none;justify-content:flex-end}.ov.on{display:flex}
.modal{background:var(--paper);width:min(720px,100%);height:100%;overflow:auto;padding:22px 26px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.modal.center{align-self:center;margin:auto;height:auto;max-height:92vh;border-radius:12px;width:min(640px,calc(100% - 24px))}
.modal h2{font-size:25px}
.box{padding:12px 16px;border-radius:8px;margin-top:12px;background:var(--card);border:1px solid var(--line)}
.box h5{margin:0 0 6px;font-family:var(--head);font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.box ul{margin:0;padding-left:20px}.box li{margin:5px 0}
.stg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stg label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#fff;font-size:15.5px}
.stg label.on{background:#DDF0E4;border-color:var(--ok)}
.stg b{display:block;font-family:var(--head);font-size:13.5px}
.checks label,.steps label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.cm{padding:10px 14px;border-radius:8px;background:var(--card);border:1px solid var(--line);margin-top:8px}
.mention{background:#FFF1C9;border-radius:4px;padding:0 4px}
.pillbar{display:flex;gap:6px;flex-wrap:wrap}.pillbar button{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px;min-height:36px}.pillbar button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.panel{position:fixed;top:60px;right:16px;width:min(430px,calc(100vw - 32px));max-height:75vh;overflow:auto;z-index:70;display:none;box-shadow:0 14px 40px rgba(0,0,0,.2)}.panel.on{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;z-index:90;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}.toast.on{opacity:1}
.struct{width:100%;border-collapse:collapse;font-size:16px}.struct td,.struct th{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}.struct th{font-family:var(--head);font-size:13px;color:var(--muted)}
.pgb{height:7px;border-radius:99px;background:var(--acc);min-width:5px;margin-bottom:3px}
.hyp{background:var(--accsoft);border-left:4px solid var(--acc);padding:10px 14px;border-radius:0 8px 8px 0}
.code{background:#232634;color:#EDEEF6;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5;overflow-x:auto;white-space:pre;margin:6px 0 0}
.mod{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:10px;overflow:hidden}
.mod>button{display:flex;width:100%;gap:14px;align-items:center;padding:13px 18px;border:0;background:transparent;text-align:left;min-height:56px}
.mod .mb{display:none;padding:2px 18px 18px}.mod.open .mb{display:block}
.mod .no{font-family:var(--head);font-weight:800;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px}
.mod.done .no{background:var(--ok);border-color:var(--ok);color:#fff}
.tabs2{display:flex;gap:6px;flex-wrap:wrap}.tabs2 button{border:1px solid var(--line);background:#fff;padding:4px 12px;border-radius:999px;min-height:34px}.tabs2 button.on{background:var(--ink);color:#fff}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--paper)}
.login .box2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px;max-width:420px;width:100%}
.login h1{font-size:30px}
.login label{display:block;margin:14px 0 5px}
.banner{background:#FFF4D1;border-bottom:1px solid #E6CF86;padding:8px 20px;font-size:15.5px;text-align:center}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.map{grid-template-columns:1fr}.map div:not(:last-child)::after{display:none}.chs{flex-wrap:wrap}.chs button{flex:1 1 33%!important;border-bottom:1px solid var(--line)}.milestones{grid-template-columns:repeat(2,minmax(0,1fr));border-top:0}.milestones div::before{display:none}.stg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){body{font-size:17px}.wrap,.bar .in{padding:0 14px}.g2,.g3,.g4{grid-template-columns:1fr}.brand span{display:none}.it,.ithead{grid-template-columns:50px minmax(0,1fr)}.it>*:nth-child(n+3){grid-column:2}.ithead{display:none}.modal{padding:18px 16px 40px}.userchip span:last-child{display:none}.board{grid-template-columns:repeat(6,78vw)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* hình minh hoạ, lịch Gantt, agenda cá nhân */
.vt{border-left:2px solid var(--ink);margin-left:6px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:15px;color:var(--muted);margin-top:6px}
.flowimg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.flowimg .st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:relative}
.flowimg .st b{display:block;margin-top:6px}
.flowimg .st:not(:last-child)::after{content:"";position:absolute;right:-9px;top:34px;width:12px;height:12px;border-right:3px solid var(--ink);border-top:3px solid var(--ink);transform:rotate(45deg);z-index:2}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.gantt{position:relative;min-width:980px;display:grid;grid-template-columns:var(--lw,150px) 1fr}
.gantt .gh{height:44px;border-bottom:1px solid var(--line);position:relative;font-size:13.5px;color:var(--muted)}
.gantt .gh span{position:absolute;top:4px;transform:translateX(-1px);padding-left:4px;border-left:1px solid var(--line);height:34px}
.gantt .gl{border-bottom:1px solid var(--line);padding:8px 10px;font-size:15.5px;display:flex;align-items:flex-start;gap:8px;min-width:0}
.gl1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:100%}
.gantt .gt{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,#EAE6DA 1px,transparent 1px);background-size:calc(100%*7/var(--n)) 100%}
.gantt .gov{position:absolute;left:var(--lw,150px);right:0;top:0;bottom:0;pointer-events:none}
.gantt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.gantt .today i{position:absolute;top:2px;left:4px;font-style:normal;font-size:12.5px;color:var(--bad);background:var(--card);padding:0 3px;white-space:nowrap}
.gantt .ms{position:absolute;top:28px;width:11px;height:11px;background:var(--ink);transform:rotate(45deg);margin-left:-5px}
.gb{position:absolute;height:22px;border-radius:5px;border:1px solid;padding:0 6px;font-size:13.5px;line-height:20px;overflow:hidden;white-space:nowrap;text-align:left;cursor:pointer;font-weight:700}
.gb:hover{outline:2px solid var(--ink)}
.gb .pf{position:absolute;left:0;top:0;bottom:0;opacity:.35;z-index:0}
.gb span{position:relative;z-index:1}
.gm{position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid;background:#fff;margin-left:-5px;top:5px;z-index:2}
.gm.on{background:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid;vertical-align:-2px;margin-right:5px;background:#fff}
.legend i.f{background:var(--ink)}
.wl{display:grid;grid-template-columns:150px 1fr 120px;gap:10px;align-items:center;margin:8px 0}
.wlb{height:16px;background:var(--soft);border-radius:4px;overflow:hidden;display:flex}
.wlb i{display:block;height:100%}
.hello{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigini{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;border:3px solid;flex:0 0 auto}
.wkh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;margin:26px 0 10px}
.helpchip{background:#FFF1C9;border:1px solid #E6CF86;color:#6a5100;border-radius:999px;padding:0 10px;font-size:14px}
.note{border-left:4px solid var(--line);padding:2px 0 2px 10px;margin-top:8px;font-size:15.5px;color:var(--muted);font-style:italic}
.pilico{width:64px;height:64px}
@media (max-width:980px){.flowimg{grid-template-columns:repeat(2,minmax(0,1fr))}.flowimg .st:not(:last-child)::after{display:none}}
@media (max-width:760px){.flowimg{grid-template-columns:1fr}.wl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="card panel" id="panel" role="dialog" aria-label="Thông báo"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== v3: người, chương, mốc ===== */
const MEM={
 ca:{n:'Châu Anh',full:'Phạm Châu Anh',user:'chauanh',ini:'CA',acc:'#B4501F',soft:'#FBE9DD',ink:'#8A3A12',role:'Nhóm trưởng · chạy số liệu',

const SIM_R = `# SIMULATED DATA – chỉ để tập thao tác, KHÔNG phải dữ liệu nghiên cứu
set.seed(123)            # cố định số ngẫu nhiên để mọi người ra cùng kết quả
n   <- 100               # tạo 100 quan sát giả
x   <- rnorm(n)          # biến giải thích giả
y   <- 1 + 0.5 * x + rnorm(n)   # biến phụ thuộc giả: có quan hệ với x cộng nhiễu
sim <- data.frame(y, x)  # gộp thành bảng dữ liệu
fit <- lm(y ~ x, data = sim)    # chạy OLS: y giải thích bởi x
summary(fit)             # xem bảng kết quả`;

 {id:'L5',t:'Tạo biến biến động tỷ giá',goal:'Từ tỷ giá hằng ngày tính ra một con số biến động cho mỗi tháng.',why:'Biến phụ thuộc của H1 và H2; cách tính phải rõ ràng và tái lập được.',need:'File tỷ giá hằng ngày (chuỗi chính).',
  steps:['Sắp xếp dữ liệu theo ngày tăng dần.','Tính log-return: r(t) = ln(P(t)) − ln(P(t−1)).','Chỉ tính trên các ngày có giao dịch; không điền giá cho ngày nghỉ.','Nhóm theo tháng, tính độ lệch chuẩn của r trong tháng.','Đếm số ngày có số liệu mỗi tháng; gắn cờ tháng quá ít ngày.','Vẽ đồ thị Vol để tìm giá trị bất thường.'],
  out:'Bảng Vol theo tháng kèm số ngày quan sát.',check:['Hai người tính độc lập ra cùng kết quả','Không có tháng nào Vol = 0 do điền giá cho ngày nghỉ'],mis:['Tính SD của giá thay vì SD của log-return.','Điền giá cho ngày nghỉ làm return bằng 0.'],
  simple:'Log-return là "tỷ giá hôm nay thay đổi bao nhiêu phần trăm so với hôm qua". Độ lệch chuẩn của chuỗi các phần trăm này trong một tháng cho biết tháng đó rung lắc nhiều hay ít. Ví dụ giả định: tỷ giá từ 25.000 lên 25.100 → r = ln(25.100/25.000) ≈ 0,004 (khoảng 0,4%).',
  code:{R:`# VÍ DỤ MINH HOẠ – cột date và rate phải khớp với file thật
library(tidyverse); library(lubridate)
fx <- read_csv("01_raw/fx_daily.csv")      # cột: date, rate
vol_m <- fx %>%
  arrange(date) %>%                                   # sắp xếp theo ngày
  mutate(ret = log(rate) - log(lag(rate))) %>%        # log-return hằng ngày
  mutate(month = floor_date(date, "month")) %>%       # gắn mỗi ngày vào tháng của nó
  group_by(month) %>%
  summarise(vol = sd(ret, na.rm = TRUE),              # độ lệch chuẩn trong tháng
            n_days = sum(!is.na(ret)))                # số ngày có số liệu`,Stata:`* VÍ DỤ MINH HOẠ – date phải là biến ngày của Stata
sort date
gen ret = ln(rate) - ln(rate[_n-1])
gen month = mofd(date)
format month %tm
collapse (sd) vol=ret (count) n_days=ret, by(month)`}},
 {id:'L6',t:'Xây dựng proxy can thiệp',goal:'Tạo biến Sales(t) = −ΔRes(t) và hiểu vì sao đây chỉ là proxy.',why:'Việt Nam không công bố số liệu can thiệp; đây là chỗ yếu nhất của đề tài và hội đồng sẽ hỏi.',need:'Chuỗi dự trữ đã xử lý khuyết (T4.6).',
  steps:['Tính ΔRes(t) = Res(t) − Res(t−1).','Đặt Sales(t) = −ΔRes(t) (Sales > 0: dự trữ giảm, bán ròng proxy).','Tách phần mua (ΔRes > 0) và phần bán (ΔRes < 0).','Đánh dấu tháng nằm trong khoảng trống ≥ 3 tháng là thiếu (không tính).','Viết ngắn: vì sao dự trữ giảm chưa chắc là NHNN bán USD.'],
  out:'Các cột dres, sales, buy, sell.',check:['Ví dụ: dự trữ từ 80,0 xuống 79,0 → sales = +1,0 (ví dụ giả định)','Cả nhóm giải thích được đánh giá lại tài sản ảnh hưởng thế nào'],mis:['Gọi ΔRes là "lượng can thiệp" mà không nói rõ là proxy.','Diễn giải ngược dấu.'],
  simple:'Giống nhìn số dư tài khoản tiết kiệm: số dư giảm có thể do bạn rút tiền, nhưng cũng có thể do phí hoặc lãi thay đổi. Dự trữ giảm có thể do NHNN bán USD, nhưng cũng do đánh giá lại tài sản hay Chính phủ trả nợ.',
  code:{R:`# VÍ DỤ MINH HOẠ – res_usd phải khớp với tên cột dự trữ thật
df <- df %>%
  arrange(month) %>%
  mutate(dres  = res_usd - lag(res_usd),   # thay đổi dự trữ so với tháng trước
         sales = -dres,                    # >0 nghĩa là dự trữ giảm (bán ròng proxy)
         buy   = pmax(dres, 0),            # phần dự trữ tăng
         sell  = pmax(-dres, 0))           # phần dự trữ giảm`,Stata:`* VÍ DỤ MINH HOẠ
tsset month
gen dres  = D.res_usd
gen sales = -dres
gen buy   = max(dres, 0)
gen sell  = max(-dres, 0)`}},
 {id:'L7',t:'Xây dựng biến dự trữ ngoại hối',goal:'Tính Import Cover (số tháng nhập khẩu) và biến đã chuẩn hoá để làm tương tác.',why:'Biến điều tiết của H2; chuẩn hoá giúp đọc hệ số tương tác đúng.',need:'Chuỗi dự trữ và nhập khẩu tháng.',
  steps:['Tính nhập khẩu bình quân 12 tháng liền trước.','Tính Cover = dự trữ / nhập khẩu bình quân tháng.','Tính Cover_c = Cover − trung bình mẫu.','Quyết định bằng văn bản về ngưỡng "cao/thấp" TRƯỚC khi chạy hồi quy; không đổi ngưỡng sau.','Ghi lại lý do nếu không tính được ARA.'],
  out:'Các cột cover, cover_c.',check:['Cover có giá trị hợp lý (không âm, không vô lý)','Đã ghi rõ định nghĩa vào Variable Log'],mis:['Chia cho nhập khẩu một tháng (nhiễu).','Đổi ngưỡng để p-value đẹp.'],
  simple:'"Dự trữ đủ cho mấy tháng nhập khẩu" giống như hỏi tiền trong ví đủ ăn mấy tháng. Dùng chi tiêu trung bình 12 tháng thay vì chỉ một tháng để một tháng chi nhiều bất thường không làm sai kết quả.',
  code:{R:`# VÍ DỤ MINH HOẠ – imports_usd là nhập khẩu từng tháng (USD)
df <- df %>%
  arrange(month) %>%
  mutate(imp12   = zoo::rollmeanr(lag(imports_usd), 12, fill = NA), # trung bình 12 tháng liền trước
         cover   = res_usd / imp12,                                  # số tháng nhập khẩu
         cover_c = cover - mean(cover, na.rm = TRUE))                # chuẩn hoá (trừ trung bình)`,Stata:`* VÍ DỤ MINH HOẠ
tsset month
gen imp12 = (L1.imports_usd + L2.imports_usd + L3.imports_usd + L4.imports_usd + L5.imports_usd + L6.imports_usd + L7.imports_usd + L8.imports_usd + L9.imports_usd + L10.imports_usd + L11.imports_usd + L12.imports_usd)/12
gen cover = res_usd / imp12
summarize cover
gen cover_c = cover - r(mean)`}},
 {id:'L8',t:'Tạo các biến giám sát Mỹ',goal:'Mã hoá trạng thái giám sát, sự kiện công bố và khoảng cách tới ngưỡng 2% GDP.',why:'Biến sai mốc thì H3 vô nghĩa; trạng thái và sự kiện là hai thứ khác nhau.',need:'Bảng mốc Mỹ đã xác minh (T0.5, T0.6).',
  steps:['Mở bảng mốc đã xác minh; chỉ dùng mốc có link PDF.','Biến trạng thái: bằng 1 trong các tháng Việt Nam ở trạng thái đó (một biến cho mỗi trạng thái).','Biến sự kiện: bằng 1 trong tháng công bố báo cáo.','Biến khoảng cách: tổng mua ròng 12 tháng (proxy) chia GDP.','Ghi từng mốc và nguồn vào Variable Log.'],
  out:'Các cột us_status, us_event, dist_threshold.',check:['Mỗi mốc có link PDF gốc','Không có mốc nào lấy từ outline chưa xác minh'],mis:['Dùng một dummy cho cả sự kiện và trạng thái.','Quên rằng báo cáo đánh giá 12 tháng trước đó.'],
  simple:'"Sự kiện" là ngày thầy phát bảng điểm; "trạng thái" là việc em đang bị nhắc nhở hay không trong cả học kỳ. Hành vi học tập thay đổi theo trạng thái nhiều hơn theo đúng ngày phát bảng điểm.',
  code:{R:`# VÍ DỤ MINH HOẠ – các ngày dưới đây là CHỖ TRỐNG, thay bằng mốc đã xác minh từ báo cáo gốc
df <- df %>%
  mutate(us_status = if_else(month >= as.Date("YYYY-MM-01") & month < as.Date("YYYY-MM-01"), 1, 0), # THAY mốc thật
         us_event  = if_else(month %in% as.Date(c("YYYY-MM-01")), 1, 0)) %>%                        # THAY tháng công bố thật
  arrange(month) %>%
  mutate(buy12 = zoo::rollsumr(buy, 12, fill = NA),           # tổng mua ròng proxy 12 tháng
         dist_threshold = buy12 / gdp_usd)                     # chia GDP (USD, 12 tháng)`,Stata:`* VÍ DỤ MINH HOẠ – THAY mốc thật vào chỗ YYYYmM
gen us_status = (month >= tm(YYYYmM) & month < tm(YYYYmM))
gen us_event  = (month == tm(YYYYmM))
tsset month
gen buy12 = buy + L1.buy + L2.buy + L3.buy + L4.buy + L5.buy + L6.buy + L7.buy + L8.buy + L9.buy + L10.buy + L11.buy
gen dist_threshold = buy12 / gdp_usd`}},
 {id:'L9',t:'Vẽ đồ thị chuỗi thời gian',goal:'Nhìn dữ liệu bằng mắt trước khi chạy mô hình.',why:'Đồ thị giúp phát hiện lỗi dữ liệu, gãy cấu trúc và các giai đoạn đặc biệt.',need:'Bộ dữ liệu sạch.',
  steps:['Vẽ tỷ giá, dự trữ, Vol, Cover theo thời gian.','Thêm đường thẳng đứng tại các mốc Mỹ đã xác minh.','Ghi đơn vị, nguồn trên mỗi đồ thị.','Viết dưới mỗi đồ thị hai dòng: "Đọc được gì" và "Không thể kết luận gì".'],
  out:'5 đồ thị trong 04_output.',check:['Mọi đồ thị có tiêu đề và đơn vị','Có dòng "không thể kết luận"'],mis:['Dùng trục kép khiến hai đường trông có quan hệ.','Kết luận nhân quả chỉ từ đồ thị.'],
  simple:'Đồ thị giống ảnh chụp X-quang: thấy được chỗ bất thường, nhưng chưa nói được nguyên nhân.',
  code:{R:`# VÍ DỤ MINH HOẠ
ggplot(df, aes(x = month, y = vol)) +
  geom_line() +
  labs(title = "Biến động tỷ giá theo tháng", x = "Tháng", y = "Vol (SD của log-return)",
       caption = "Nguồn: tính toán của nhóm từ dữ liệu NHNN") +
  theme_minimal()
# Thêm mốc Mỹ: + geom_vline(xintercept = as.Date("YYYY-MM-01"), linetype = "dashed")  # THAY mốc thật`,Stata:`* VÍ DỤ MINH HOẠ
tsset month
tsline vol, title("Biến động tỷ giá theo tháng")`}},
 {id:'L10',t:'Tính dừng và kiểm định ADF',goal:'Biết chuỗi có "trôi" theo thời gian hay không và xử lý đúng.',why:'Hồi quy trên chuỗi không dừng có thể cho kết quả giả (spurious regression).',need:'Các chuỗi sẽ đưa vào mô hình.',
  steps:['Hiểu: chuỗi dừng dao động quanh một mức ổn định; chuỗi không dừng trôi dần.','H0 của ADF: chuỗi có nghiệm đơn vị (không dừng). H1: chuỗi dừng.','Chạy ADF cho từng biến.','Nếu p-value nhỏ (ví dụ < 0,05): bác bỏ H0, có bằng chứng chuỗi dừng.','Nếu không bác bỏ: lấy sai phân (ΔX) hoặc log-sai phân; kiểm lại.','Ghi quyết định vào log, kể cả số độ trễ đã dùng.'],
  out:'Bảng kết quả ADF của các biến.',check:['Mỗi biến trong mô hình đã được kiểm','Đã ghi số độ trễ và loại kiểm định (có hằng số/xu hướng)'],mis:['Quên rằng ΔRes đã là một phép sai phân.','Dùng mẫu ngắn mà tin chắc vào ADF (kiểm định có ít sức mạnh với mẫu nhỏ).'],
  simple:'Chuỗi dừng như người đi bộ quanh quán cà phê, luôn quay lại gần quán. Chuỗi không dừng như người đi lang thang, càng lúc càng xa. ADF kiểm tra xem chuỗi có phải "người đi lang thang" không.',
  code:{R:`library(tseries)
adf.test(na.omit(df$vol))      # H0: có nghiệm đơn vị (không dừng); p nhỏ → bằng chứng dừng
adf.test(na.omit(df$sales))
# Nếu không dừng: lấy sai phân rồi kiểm lại
adf.test(na.omit(diff(df$cover)))`,Stata:`tsset month
dfuller vol, lags(3)         // H0: có nghiệm đơn vị; p nhỏ → bằng chứng dừng
dfuller sales, lags(3)
dfuller D.cover, lags(3)`}},
 {id:'L11',t:'Chạy hồi quy OLS',goal:'Chạy được một hồi quy và hiểu bảng kết quả.',why:'Đây là công cụ chính của Model 1.',need:'Dữ liệu đã nhập; biến đã tạo (L5–L8); đã hiểu L10.',
  steps:['Tạo các biến trễ: vol_l1, sales_l1, cover_c_l1.','Viết phương trình: Vol(t) = α + ρ·Vol(t−1) + β·Sales(t−1) + γ·X(t) + ε(t).','Chạy hồi quy.','Đọc bảng: Estimate (hệ số), Std. Error, t value, p-value.','Làm bài tập với SIMULATED DATA trước, rồi mới chạy dữ liệu thật.'],
  out:'Bảng kết quả hồi quy lưu bằng văn bản (log).',check:['Biết α, ρ, β, γ nghĩa là gì','Số quan sát trong bảng đúng như dự kiến'],mis:['Quên biến Vol(t−1).','Chạy rồi chỉ chép số "đẹp".'],
  simple:'OLS là cách vẽ một đường thẳng gần nhất với đám điểm. Hệ số β cho biết khi Sales tăng một đơn vị thì Vol (trung bình) thay đổi bao nhiêu đơn vị, nếu các biến còn lại giữ nguyên.',
  code:{R:`# --- PHẦN A: SIMULATED DATA (chỉ tập thao tác) ---
${SIM_R}

# --- PHẦN B: DỮ LIỆU THẬT (VÍ DỤ MINH HOẠ – tên biến phải khớp dữ liệu thật) ---
df <- df %>% arrange(month) %>%
  mutate(vol_l1 = lag(vol, 1), sales_l1 = lag(sales, 1))
m1 <- lm(vol ~ vol_l1 + sales_l1 + ratediff + usd, data = df)
summary(m1)`,Stata:`* --- PHẦN A: SIMULATED DATA ---
${SIM_S}

* --- PHẦN B: DỮ LIỆU THẬT (VÍ DỤ MINH HOẠ) ---
tsset month
gen vol_l1 = L.vol
gen sales_l1 = L.sales
regress vol vol_l1 sales_l1 ratediff usd`}},
 {id:'L12',t:'Hiểu hệ số và p-value',goal:'Đọc bảng hồi quy đúng, không diễn giải quá mức.',why:'Hội đồng thường hỏi "p-value này nghĩa là gì".',need:'Một bảng hồi quy đã chạy.',
  steps:['Estimate: ước lượng của hệ số; dấu cho biết hướng, độ lớn cho biết mức.','Std. Error: độ không chắc chắn của ước lượng.','p-value: nếu thực tế hệ số bằng 0, xác suất ra kết quả cực đoan bằng hoặc hơn kết quả nhóm thấy.','R-squared: tỷ lệ biến thiên của Vol được mô hình giải thích; không đánh giá mô hình đúng hay sai.','Luôn tự hỏi: dấu có đúng kỳ vọng? độ lớn có ý nghĩa kinh tế?'],
  out:'Một đoạn diễn giải mẫu cho mỗi hệ số chính.',check:['Giải thích được p = 0,03 và p = 0,30 nghĩa là gì','Phân biệt được ý nghĩa thống kê và ý nghĩa kinh tế'],mis:['Hiểu p-value là xác suất giả thuyết đúng.','Viết "không có tác động" khi p > 0,05 (đúng ra là "chưa tìm thấy bằng chứng").'],
  simple:'p-value giống tiếng chuông báo động: chuông kêu (p nhỏ) nghĩa là "có vẻ không phải ngẫu nhiên", chưa kêu không có nghĩa là hoàn toàn an toàn. Một hệ số có p nhỏ nhưng quá bé về độ lớn thì vẫn không quan trọng trong thực tế.'},
 {id:'L13',t:'Sai số chuẩn Newey–West',goal:'Có sai số chuẩn đáng tin hơn khi sai số hồi quy có tự tương quan hoặc phương sai thay đổi.',why:'Dữ liệu chuỗi thời gian thường có tự tương quan; sai số chuẩn thông thường sẽ quá nhỏ.',need:'Mô hình OLS đã chạy (L11).',
  steps:['Chọn độ trễ L (quy tắc tham khảo: làm tròn xuống 4·(T/100)^(2/9), với T là số quan sát).','Chạy lại với sai số Newey–West.','So sánh sai số chuẩn trước và sau.','Thử L từ 1 đến 6 để xem kết luận có thay đổi không.','Ghi độ trễ đã dùng trong báo cáo.'],
  out:'Bảng Newey–West cho Model 1.',check:['Đã ghi L trong chú thích bảng','Kết luận không đổi theo L hoặc đã nêu rõ'],mis:['Chọn L cho đến khi p-value đẹp.','Cho rằng Newey–West giải quyết được nội sinh (không phải vậy).'],
  simple:'Sai số hồi quy giống tiếng vọng: tháng này còn vang lại từ tháng trước. Sai số chuẩn thường coi mỗi tháng độc lập nên quá tự tin. Newey–West điều chỉnh để "bớt tự tin" đúng mức.',
  code:{R:`library(sandwich); library(lmtest)
coeftest(m1, vcov = NeweyWest(m1, lag = 3, prewhite = FALSE))   # L = 3 là VÍ DỤ; dùng quy tắc ở trên`,Stata:`newey vol vol_l1 sales_l1 ratediff usd, lag(3)    // lag(3) là VÍ DỤ`}},
 {id:'L14',t:'Biến tương tác và hiệu ứng điều tiết',goal:'Kiểm tra tác động của Sales có phụ thuộc vào mức dự trữ không.',why:'Đây là cách kiểm định H2 mà không phải chia mẫu theo ngưỡng tuỳ ý.',need:'cover_c đã chuẩn hoá (L7).',
  steps:['Viết mô hình: Vol = α + ρVol(−1) + β1·Sales(−1) + β2·Cover_c(−1) + β3·Sales(−1)×Cover_c(−1) + ...','β1: tác động của Sales khi dự trữ ở mức trung bình.','Tác động biên của Sales = β1 + β3·Cover_c.','Tính tác động biên tại dự trữ thấp (−1 SD) và cao (+1 SD), kèm sai số chuẩn.','Báo cáo như phân tích thăm dò và nêu rõ cỡ mẫu.'],
  out:'Bảng Model 2 + bảng tác động biên.',check:['Biến điều tiết đã chuẩn hoá','Không chia mẫu theo trung vị'],mis:['Đọc β1 như tác động trung bình khi chưa chuẩn hoá.','Kết luận ngưỡng chỉ từ một hệ số tương tác.'],
  simple:'Tác động của "bán USD" lên biến động giống tác động của "uống thuốc" lên sức khoẻ: có thể khác nhau tuỳ cơ thể khoẻ hay yếu. Hệ số tương tác đo mức khác nhau đó theo "độ khoẻ" (mức dự trữ).',
  code:{R:`# VÍ DỤ MINH HOẠ – tên biến phải khớp dữ liệu thật
df <- df %>% mutate(cover_c_l1 = lag(cover_c, 1))
m2 <- lm(vol ~ vol_l1 + sales_l1 * cover_c_l1 + ratediff + usd, data = df)   # '*' tạo cả biến đơn và biến tương tác
library(car); library(sandwich)
sd_c <- sd(df$cover_c_l1, na.rm = TRUE)
# Tác động biên của Sales khi dự trữ cao hơn trung bình 1 SD:
linearHypothesis(m2, paste0("sales_l1 + ", sd_c, "*sales_l1:cover_c_l1 = 0"),
                 vcov. = NeweyWest(m2, lag = 3, prewhite = FALSE))`,Stata:`* VÍ DỤ MINH HOẠ
gen cover_c_l1 = L.cover_c
regress vol vol_l1 c.sales_l1##c.cover_c_l1 ratediff usd, vce(robust)
summarize cover_c_l1
lincom sales_l1 + r(sd)*c.sales_l1#c.cover_c_l1     // tác động biên khi dự trữ cao hơn TB 1 SD`}},
 {id:'L15',t:'Kiểm định chẩn đoán',goal:'Kiểm tra mô hình có vi phạm giả định chính không.',why:'Kết quả chỉ đáng tin khi giả định cơ bản được kiểm tra.',need:'Mô hình OLS đã chạy.',
  steps:['VIF: đo mức độ các biến giải thích "trùng nhau"; giá trị cao (thường > 5 hoặc 10) là cảnh báo.','Breusch–Godfrey: H0 không có tự tương quan.','Breusch–Pagan: H0 phương sai không đổi.','RESET: H0 dạng hàm đúng.','Nếu phát hiện vấn đề: dùng Newey–West, đổi độ trễ, kiểm tra biến bị thiếu; ghi lại cách xử lý.'],
  out:'Bảng chẩn đoán gồm H0, p-value, kết luận, xử lý.',check:['Mỗi kiểm định ghi rõ H0','Đã ghi hướng xử lý'],mis:['Nhầm VIF là kiểm định có p-value.','Bỏ qua kết quả không có lợi.'],
  simple:'Giống đi khám tổng quát trước khi chạy marathon: không phải để "được điểm cao", mà để biết cơ thể (mô hình) có chịu nổi không.',
  code:{R:`library(car); library(lmtest)
vif(m1)                              # đa cộng tuyến (không phải kiểm định có p-value)
bgtest(m1, order = 3)                # tự tương quan (Breusch–Godfrey)
bptest(m1)                           # phương sai thay đổi (Breusch–Pagan)
resettest(m1, power = 2:3, type = "fitted")   # dạng hàm (RESET)`,Stata:`regress vol vol_l1 sales_l1 ratediff usd
estat vif
estat bgodfrey, lags(1/3)
estat hettest
estat ovtest`}},
 {id:'L16',t:'Kiểm tra độ vững (robustness)',goal:'Xem kết luận có thay đổi khi đổi cách đo hoặc mẫu không.',why:'Một kết quả chỉ đáng tin nếu không biến mất khi đổi lựa chọn hợp lý.',need:'Danh sách robustness đã được duyệt trước (T5.4).',
  steps:['Chạy đúng các kiểm tra trong danh sách: đổi Vol, đổi proxy, đổi độ trễ, dữ liệu quý, bỏ tháng nội suy, đổi cách đo dự trữ, đổi khoảng thời gian.','Với mỗi kiểm tra ghi dấu và mức ý nghĩa của hệ số chính.','Ghi nhận mọi thay đổi, kể cả khi kết quả mất ý nghĩa.','Không thêm kiểm tra mới sau khi nhìn kết quả; nếu thêm, ghi vào Change Log kèm lý do.'],
  out:'Bảng robustness.',check:['Mọi kiểm tra trong danh sách đã chạy','Báo cáo cả kiểm tra không có lợi'],mis:['Chọn kiểm tra có lợi để báo cáo.'],
  simple:'Nếu một đáp án chỉ đúng khi làm tròn theo một cách riêng, thì đó chưa phải đáp án chắc chắn.',
  code:{R:`# VÍ DỤ MINH HOẠ – thử nhiều độ trễ Newey–West
for (L in 1:6) {
  cat("Newey-West lag =", L, "\\n")
  print(coeftest(m1, vcov = NeweyWest(m1, lag = L, prewhite = FALSE)))
}
# Bỏ các tháng nội suy
m1_nointerp <- lm(vol ~ vol_l1 + sales_l1 + ratediff + usd, data = filter(df, interp == 0))`,Stata:`* VÍ DỤ MINH HOẠ
forvalues L = 1/6 {
    newey vol vol_l1 sales_l1 ratediff usd, lag(\`L')
}
newey vol vol_l1 sales_l1 ratediff usd if interp==0, lag(3)`}},
 {id:'L17',t:'Diễn giải và báo cáo kết quả',goal:'Viết kết quả đúng, đủ, thận trọng.',why:'Điểm cao đến từ sự trung thực và rõ ràng, không đến từ kết quả "đẹp".',need:'Bảng kết quả của Model 1–3 và robustness.',
  steps:['Với mỗi giả thuyết: nêu hệ số, dấu, sai số chuẩn, p-value (số thật từ log).','Phân biệt ý nghĩa thống kê và ý nghĩa kinh tế.','Dùng từ "có mối liên hệ", "chưa tìm thấy bằng chứng", không dùng "chứng minh", "gây ra".','Phân biệt tác động ngắn hạn (độ trễ 1) và các độ trễ sau.','Đưa bảng tất cả mô hình đã chạy vào phụ lục.'],
  out:'Bản diễn giải 2–3 trang.',check:['Mọi con số khớp log','Không có câu nào mạnh hơn bằng chứng'],mis:['Cherry-picking.','Giấu kết quả không có ý nghĩa thống kê.'],
  simple:'Kết quả "chưa tìm thấy bằng chứng" vẫn là kết quả khoa học có giá trị: nó cho biết với dữ liệu hiện có, giả thuyết chưa được ủng hộ, và gợi ý cần dữ liệu tốt hơn.'}
];

/* ===== HỌC LÀM: bài học ngắn, từng bước (R là phần mềm đề xuất, Stata là phương án khác) ===== */
const LEARN_TXT=[
 ['L2','Cài và làm quen phần mềm','Có một phần mềm chạy số liệu hoạt động trên máy của Châu Anh và Bích Ngọc.','Hai người phải dùng cùng một phần mềm thì mới so được kết quả.',['Cài R, rồi cài RStudio (tải từ trang chính thức của dự án R và của Posit).','Mở RStudio, chọn File → New Project, chọn thư mục NCKH không có dấu tiếng Việt.','Gõ 1+1 vào ô “Console” rồi nhấn Enter, phải thấy số 2.','Chạy các lệnh cài gói trong khung mã bên dưới (chỉ cần chạy 1 lần).'],'Lệnh 1+1 chạy ra 2 và lệnh getwd() hiện đúng thư mục dự án.',['Cài vào thư mục có dấu tiếng Việt nên bị lỗi.','Quên chạy library(tidyverse) mỗi lần mở lại.']],

 ['L7','Tính dự trữ đủ cho mấy tháng nhập khẩu','Tạo thước đo mức dự trữ cao hay thấp.','Dùng cho giả thuyết 2 (vai trò của dự trữ).',['Với mỗi tháng, lấy nhập khẩu trung bình 12 tháng liền trước.','Chia dự trữ cho số đó.','Trừ đi giá trị trung bình cả kỳ (gọi là “chuẩn hoá”) để dùng trong mô hình.','Ghi lại, TRƯỚC khi chạy mô hình, cách bạn định nghĩa dự trữ cao hay thấp.'],'Cột “dự trữ đủ mấy tháng”.',['Chia cho nhập khẩu của đúng một tháng (rất nhiễu).','Đổi ngưỡng cho đến khi kết quả đẹp.']],

 ['L10','Chuỗi có trôi không?','Biết chuỗi số có “trôi” (không dừng) hay dao động quanh một mức ổn định.','Hồi quy trên chuỗi trôi có thể cho kết quả giả.',['Hiểu: kiểm định ADF có giả thuyết gốc là “chuỗi trôi” (không dừng).','Chạy ADF cho từng biến.','Nếu p-value nhỏ (ví dụ dưới 0,05): có bằng chứng chuỗi dừng.','Nếu không: lấy sai phân (hiệu hai tháng liên tiếp) và kiểm lại.'],'Bảng kết quả ADF cho các biến.',['Quên rằng thay đổi dự trữ đã là một sai phân.','Tin tuyệt đối vào ADF khi chỉ có ít tháng.']],

 ['L13','Sai số chuẩn bền (Newey–West)','Có sai số chuẩn đáng tin hơn khi tháng này ảnh hưởng tháng sau.','Số liệu theo thời gian thường “vang” từ tháng này sang tháng sau.',['Chọn độ trễ (số tháng “vang”), ví dụ theo quy tắc trong khung mã.','Chạy lại với Newey–West.','So sai số chuẩn trước và sau.','Thử độ trễ từ 1 đến 6 xem kết luận có đổi không.'],'Bảng Newey–West cho mô hình 1.',['Chọn độ trễ cho đến khi p-value đẹp.']],
 ['L14','Hệ số tương tác','Xem tác động của can thiệp có khác nhau khi dự trữ cao hay thấp.','Đây là cách kiểm tra giả thuyết 2 mà không phải chia mẫu tuỳ ý.',['Thêm vào mô hình tích “can thiệp × dự trữ (đã chuẩn hoá)”.','Tác động của can thiệp = hệ số can thiệp + hệ số tích × mức dự trữ.','Tính tác động ở mức dự trữ thấp (thấp hơn trung bình 1 độ lệch chuẩn) và cao.','Báo cáo như phân tích thăm dò, ghi rõ số tháng.'],'Bảng mô hình 2 + bảng tác động ở dự trữ thấp/cao.',['Đọc hệ số can thiệp như tác động trung bình khi chưa chuẩn hoá.']],
 ['L15','Kiểm tra mô hình khoẻ','Kiểm tra mô hình có vi phạm các điều kiện cơ bản không.','Kết quả chỉ đáng tin khi mô hình ổn.',['Kiểm tra các biến có “trùng nhau” quá không (VIF).','Kiểm tra sai số có tự lặp lại không (Breusch–Godfrey).','Kiểm tra mức dao động của sai số có đều không (Breusch–Pagan).','Kiểm tra dạng mô hình có hợp lý không (RESET).'],'Bảng chẩn đoán: mỗi kiểm tra có kết luận và hướng xử lý.',['Nhầm VIF là kiểm định có p-value.','Bỏ qua kết quả không có lợi.']],

 ['L17','Viết kết quả cho đúng','Viết kết quả thận trọng và trung thực.','Điểm cao đến từ sự rõ ràng và trung thực, không đến từ kết quả “đẹp”.',['Với mỗi giả thuyết: ghi hệ số, dấu, p-value (số thật từ nhật ký).','Phân biệt “có ý nghĩa thống kê” và “đủ lớn để quan trọng”.','Dùng “có mối liên hệ”, “chưa tìm thấy bằng chứng”, không dùng “chứng minh”, “gây ra”.','Đưa bảng mọi mô hình đã chạy vào phụ lục.'],'Bản diễn giải 2–3 trang.',['Chọn kết quả đẹp để viết.']]

const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const today=()=>window.__TODAY||iso(new Date());
const ddiff=(a,b)=>Math.round((pd(b)-pd(a))/86400000);
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const fd=s=>{if(!s)return '—';const a=s.split('-');return a[2]+'/'+a[1];};
const fdy=s=>{if(!s)return '—';const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0];};
const fdw=s=>s?WD[pd(s).getDay()]+' '+fd(s):'—';
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const nowISO=()=>new Date().toISOString();
function ago(t){const d=(Date.now()-new Date(t).getTime())/1000;if(d<60)return 'vừa xong';if(d<3600)return Math.floor(d/60)+' phút trước';if(d<86400)return Math.floor(d/3600)+' giờ trước';return Math.floor(d/86400)+' ngày trước';}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3800);}
const fmtPg=n=>String(n).replace('.',',');
const normUser=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/[^a-z0-9]/g,'');

/* ---------- kết nối: backend thật (Netlify) hoặc chế độ thử trên máy ---------- */
const RemoteApi={
  tok:null,
  async call(path,opt){
    const o=Object.assign({headers:{}},opt||{});
    o.headers['content-type']='application/json';
    if(this.tok)o.headers.authorization='Bearer '+this.tok;
    const r=await fetch('/api/'+path,o);
    let j={};try{j=await r.json();}catch(e){j={error:'server'};}
    if(!r.ok&&!j.error)j.error='server';
    j._s=r.status;return j;
  },
  login(u,pw){return this.call('login',{method:'POST',body:JSON.stringify({user:u,pw:pw})});},
  state(cs,ns){return this.call('state?cs='+encodeURIComponent(cs||'')+'&ns='+encodeURIComponent(ns||''));},
  put(col,id,patch){return this.call('put',{method:'POST',body:JSON.stringify({col:col,id:id,patch:patch})});},
  add(col,data){return this.call('add',{method:'POST',body:JSON.stringify({col:col,data:data})});},
  pw(o,n){return this.call('pw',{method:'POST',body:JSON.stringify({old:o,new:n})});},
  resetpw(m){return this.call('resetpw',{method:'POST',body:JSON.stringify({m:m})});}
};
const LocalApi={
  me:null,
  get S(){try{return JSON.parse(localStorage.getItem('nckh_local_v4')||'null')||{items:{},learn:{},sources:{},links:{},settings:{},comments:{},notifs:{},pw:{}};}catch(e){return {items:{},learn:{},sources:{},links:{},settings:{},comments:{},notifs:{},pw:{}};}},
  save(s){try{localStorage.setItem('nckh_local_v4',JSON.stringify(s));}catch(e){}},
  async login(u,pw){const m=USER2M[normUser(u)];const s=this.S;const p=(s.pw&&s.pw[m])||'demo';if(!m||pw!==p)return {error:'bad',_s:401};this.me=m;return {token:'local.'+m,m:m,must:false};},
  async state(cs,ns){const s=this.S;const f=(o,k)=>{const r={};Object.keys(o).forEach(i=>{if(i>k)r[i]=o[i];});return r;};
    const nn={};Object.keys(s.notifs).forEach(k=>{if(k.indexOf(this.me+'/')===0&&k.slice(this.me.length+1)>ns)nn[k.slice(this.me.length+1)]=s.notifs[k];});
    return {items:s.items,learn:s.learn,sources:s.sources,links:s.links,settings:s.settings,comments:f(s.comments,cs||''),notifs:nn};},
  async put(col,id,patch){const s=this.S;const key=col==='notifs'?this.me+'/'+id:id;s[col]=s[col]||{};s[col][key]=Object.assign({},s[col][key]||{},patch,col==='notifs'?{}:{by:this.me});this.save(s);return {ok:true,doc:s[col][key]};},
  async add(col,data){const s=this.S;const id=rid();if(col==='comments')s.comments[id]={itemId:data.itemId,from:this.me,text:data.text,at:nowISO(),mentions:data.mentions||[]};else s.notifs[data.to+'/'+id]={to:data.to,from:this.me,type:data.type,itemId:data.itemId,text:data.text,at:nowISO(),read:false};this.save(s);return {ok:true,id:id};},
  async pw(o,n){const s=this.S;const p=(s.pw&&s.pw[this.me])||'demo';if(o!==p)return {error:'bad',_s:401};s.pw=s.pw||{};s.pw[this.me]=n;this.save(s);return {ok:true};},
  async resetpw(m){const s=this.S;s.pw=s.pw||{};s.pw[m]='demo';this.save(s);return {ok:true,pw:'demo'};}
};

function IT(id){
  const b=BASE_I[id];if(!b)return null;const d=D.items[id]||{};
  const dl=Object.assign({},b.dl,d.dl||{});
  const keys=STAGES.filter(s=>dl[s[0]]);
  const ticks=d.ticks||{};
  const status=d.status||(keys.some(s=>ticks[s[0]])?'doing':'todo');
  const nextS=keys.find(s=>!ticks[s[0]]);
  const next=nextS?{k:nextS[0],l:nextS[1],d:dl[nextS[0]]}:null;
  const lastD=keys.length?dl[keys[keys.length-1][0]]:'2027-02-01';
  const due=next?next.d:lastD;
  const tent=!d.dueOk&&lastD>'2026-12-04';
  const fl=b.fl.filter(f=>f!=='t');if(tent)fl.push('t');
  return Object.assign({},b,{dl:dl,keys:keys,ticks:ticks,status:status,next:next,due:due,lastD:lastD,link:d.link||'',note:d.note||'',dueOk:!!d.dueOk,fl:fl,
    needsLeader:b.o!==LEADER&&b.c!==LEADER,submittedAt:d.submittedAt||null,doneAt:d.doneAt||null});
}

function writeErr(e){
  const c=e&&e.error;
  if(c==='auth'){doLogout(true);toast('Phiên đăng nhập đã hết. Hãy đăng nhập lại.');}
  else if(c==='forbidden')toast('Bạn không có quyền làm việc này.');
  else toast('Chưa lưu được. Kiểm tra mạng rồi thử lại.');
}
async function put(col,id,patch){
  pending++;D[col][id]=Object.assign({},D[col][id]||{},patch);render();
  try{const r=await Api.put(col,id,patch);if(r.error)throw r;}catch(e){writeErr(e);}finally{pending--;}
}
async function addDoc(col,data){try{const r=await Api.add(col,data);if(r.error)throw r;}catch(e){writeErr(e);}}
async function notify(to,type,itemId,text){if(!to||to===ME)return;await addDoc('notifs',{to:to,type:type,itemId:itemId||'',text:text});}
const nm=m=>MEM[m]?MEM[m].n:'?';
async function sync(){
  if(!ME||pending>0)return;
  let r;try{r=await Api.state(CS,NS);}catch(e){return;}
  if(r.error==='auth'){doLogout(true);return;}
  if(r.error||pending>0)return;
  ['items','learn','sources','links','settings'].forEach(c=>{D[c]=r[c]||{};});
  Object.assign(D.comments,r.comments||{});Object.assign(D.notifs,r.notifs||{});
  const ck=Object.keys(r.comments||{}).sort();if(ck.length)CS=ck[ck.length-1]>CS?ck[ck.length-1]:CS;
  const nk=Object.keys(r.notifs||{}).sort();if(nk.length)NS=nk[nk.length-1]>NS?nk[nk.length-1]:NS;
  render();
}
function startPoll(){clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden)sync();},8000);}

/* ---------- hành động ---------- */
const canEditI=t=>ME&&(t.o===ME||t.h.includes(ME)||ME===LEADER);
async function actTick(id,k){const t=IT(id);const ticks=Object.assign({},t.ticks);ticks[k]=!ticks[k];const p={ticks:ticks};if(t.status==='todo'&&ticks[k])p.status='doing';await put('items',id,p);}
async function actSubmit(id,link,note){
  const t=IT(id);
  if(!/^https:\/\//i.test(link)){toast('Hãy dán link bắt đầu bằng https:// (link Google Docs/Sheets).');return false;}
  const ticks=Object.assign({},t.ticks);if(t.dl.nhap)ticks.nhap=true;
  const base={link:link,note:note,submittedAt:nowISO(),submittedBy:ME,ticks:ticks};
  const label='“'+t.t+'”';
  if(t.c){await put('items',id,Object.assign(base,{status:'submitted'}));await notify(t.c,'check',id,nm(ME)+' đã nộp '+label+', nhờ bạn kiểm chéo.');}
  else if(t.o===LEADER){await put('items',id,Object.assign(base,{status:'done',doneAt:nowISO()}));}
  else{await put('items',id,Object.assign(base,{status:'checked'}));await notify(LEADER,'approve',id,nm(ME)+' đã nộp '+label+', nhờ nhóm trưởng duyệt.');}
  toast('Đã nộp bài.');return true;
}
async function actCheck(id,ok,reason){
  const t=IT(id);
  if(!ok){if(!reason){toast('Hãy viết lý do cần sửa.');return false;}
    await postComment(id,'[Cần sửa] '+reason,[t.o],true);await put('items',id,{status:'fix'});await notify(t.o,'fix',id,nm(ME)+' nhờ bạn sửa “'+t.t+'”: '+reason);return true;}
  const ticks=Object.assign({},t.ticks);if(t.dl.kiem)ticks.kiem=true;
  if(t.needsLeader){await put('items',id,{status:'checked',checkedBy:ME,ticks:ticks});await notify(LEADER,'approve',id,nm(ME)+' đã kiểm “'+t.t+'” và thấy ổn, nhờ nhóm trưởng duyệt.');await notify(t.o,'info',id,nm(ME)+' đã kiểm “'+t.t+'”, đang chờ nhóm trưởng duyệt.');}
  else{await put('items',id,{status:'done',checkedBy:ME,doneAt:nowISO(),ticks:ticks});await notify(t.o,'done',id,'“'+t.t+'” đã xong.');}
  toast('Đã ghi nhận.');return true;
}
async function actApprove(id,ok,reason){
  const t=IT(id);
  if(!ok){if(!reason){toast('Hãy viết lý do trả lại.');return false;}
    await postComment(id,'[Trả lại] '+reason,[t.o],true);await put('items',id,{status:'fix'});await notify(t.o,'fix',id,'Nhóm trưởng trả lại “'+t.t+'”: '+reason);return true;}
  await put('items',id,{status:'done',doneAt:nowISO(),approvedBy:ME});await notify(t.o,'done',id,'Nhóm trưởng đã duyệt “'+t.t+'”. Xong!');if(t.c&&t.c!==t.o)await notify(t.c,'info',id,'“'+t.t+'” đã được duyệt xong.');
  toast('Đã duyệt xong.');return true;
}
async function postComment(id,text,mentions,silent){
  const t=IT(id);const ms=Array.from(new Set((mentions||[]).filter(m=>m&&m!==ME)));
  await addDoc('comments',{itemId:id,text:text,mentions:ms});
  if(!silent){const to=new Set(ms);if(t.o!==ME)to.add(t.o);if(t.c&&t.c!==ME)to.add(t.c);
    for(const m of to)await notify(m,ms.includes(m)?'mention':'comment',id,nm(ME)+(ms.includes(m)?' nhắc đến bạn':' bình luận')+' ở “'+t.t+'”: '+text.slice(0,90));}
  await sync();
}
async function actPing(id,text){const t=IT(id);await notify(t.o,'ping',id,nm(ME)+' nhắc bạn: “'+t.t+'”'+(text?' · '+text:' (hạn '+fd(t.due)+')'));toast('Đã nhắc '+nm(t.o)+'.');}
async function actDates(id,dl,ok){const o=Object.assign({},(D.items[id]||{}).dl||{});for(const k in dl){if(dl[k])o[k]=dl[k];}await put('items',id,{dl:o,dueOk:!!ok});}
/* kéo thả: chuyển cột */
async function requestMove(id,to){
  const t=IT(id);if(!t||!ME)return;const from=t.status;if(from===to)return;
  const isLead=ME===LEADER,isOwner=t.o===ME,canW=isOwner||isLead||t.h.includes(ME);
  const deny=m=>toast(m);
  if(to==='todo'||to==='doing'){
    if(['todo','doing','fix'].includes(from)&&canW){await put('items',id,{status:to});return;}
    if(isLead&&from!=='todo'){await put('items',id,{status:to});toast('Đã mở lại mục này.');return;}
    return deny('Chỉ người viết hoặc nhóm trưởng chuyển được cột này.');
  }
  if(to==='submitted'){
    if(['todo','doing','fix'].includes(from)&&(isOwner||isLead)){openItem(id);toast('Dán link bài và tick 3 điều để nộp.');return;}
    return deny('Chỉ người viết nộp bài được, và mục phải đang ở “Chưa làm”, “Đang viết” hoặc “Cần sửa”.');
  }
  if(to==='checked'){
    if(from==='submitted'&&(t.c===ME||isLead)){await actCheck(id,true);return;}
    return deny('Chỉ người được giao kiểm mới chuyển được, khi bài đã nộp.');
  }
  if(to==='fix'){
    if((from==='submitted'&&(t.c===ME||isLead))||(from==='checked'&&isLead)){askText('Lý do cần sửa','Viết rõ chỗ nào cần sửa…',async r=>{if(from==='checked')await actApprove(id,false,r);else await actCheck(id,false,r);});return;}
    return deny('Chỉ người kiểm (hoặc nhóm trưởng) trả bài lại được.');
  }
  if(to==='done'){
    if(from==='checked'&&isLead){await actApprove(id,true);return;}
    if(from==='submitted'&&isLead&&t.c===LEADER){await actCheck(id,true);return;}
    return deny('Chỉ nhóm trưởng duyệt xong được, sau khi người kiểm đã cho qua.');
  }
}

function dueH(t,short){
  if(isDone(t))return 'Đã xong';
  const d=ddiff(today(),t.due);const lab=t.next?t.next.l+' ':'';
  if(d<0)return `<span class="over">${lab}${fd(t.due)}, trễ ${-d} ngày</span>`;
  if(d===0)return `<b>${lab}hôm nay</b>`;
  if(d<=2)return `<b>${lab}${fd(t.due)}, còn ${d} ngày</b>`;
  return lab+(short?fd(t.due):fdw(t.due));
}

function icoPillar(k){

  return `<svg class="pilico" viewBox="0 0 64 64" aria-hidden="true">${b}</svg>`;
}
function icoStep(k){
  const sk=`fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"`;
  let b='';
  if(k===1)b=`<path d="M10 38l-2 8 8-2 22-22-6-6z" ${sk}/><line x1="30" y1="14" x2="36" y2="20" ${sk}/><line x1="26" y1="44" x2="40" y2="44" stroke="${MUT}" stroke-width="2"/>`;
  else if(k===2)b=`<path d="M8 32v10h32V32" ${sk}/><path d="M24 36V10" ${sk}/><path d="M16 18l8-8 8 8" ${sk}/>`;
  else if(k===3)b=`<circle cx="21" cy="21" r="12" ${sk}/><line x1="30" y1="30" x2="42" y2="42" ${sk}/><path d="M15 21l4 4 7-8" fill="none" stroke="${ACC}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  else b=`<path d="M24 6l15 5v12c0 10-6 16-15 19C15 39 9 33 9 23V11z" ${sk}/><path d="M17 24l5 5 9-10" fill="none" stroke="${ACC}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;

/* ================= LỊCH GANTT ================= */
const G_START='2026-11-30',G_END='2027-02-14';
function ganttHTML(rows,opt){
  opt=opt||{};const S=G_START,N=ddiff(G_START,G_END)+1,t0=today();
  const pos=d=>Math.max(0,Math.min(100,ddiff(S,d)/N*100));
  let weeks='';for(let d=S;d<=G_END;d=addDays(d,7)){weeks+=`<span style="left:${pos(d)}%">${fd(d)}</span>`;}
  let h=`<div class="gwrap"><div class="gantt" style="--n:${N};--lw:${opt.lw||150}px"><div class="gh" style="border-right:1px solid var(--line)"></div><div class="gh">${weeks}</div>`;
  rows.forEach(r=>{
    const lanes=[];const its=r.items.slice().sort((a,b)=>a.s.localeCompare(b.s));
    its.forEach(it=>{let L=lanes.findIndex(e=>e<it.s);if(L<0){L=lanes.length;lanes.push('');}lanes[L]=it.e;it.lane=L;});
    const hh=Math.max(1,lanes.length)*30+10;
    h+=`<div class="gl" style="height:${hh}px">${r.label}</div><div class="gt" style="height:${hh}px">${its.map(it=>{
      const l=pos(it.s),w=Math.max(2.2,pos(it.e)-pos(it.s)+100/N);
      const marks=opt.marks?it.marks.map(m=>`<span class="gm ${m.on?'on':''}" title="${esc(m.t)}" style="left:${pos(m.d)+50/N}%;border-color:${it.col}"></span>`).join(''):'';
      return `<button class="gb" data-act="open" data-id="${it.id}" title="${esc(it.title)}" style="left:${l}%;width:${w}%;top:${5+it.lane*30}px;border-color:${it.col};background:${it.done?it.col:'#fff'};color:${it.done?'#fff':INK}"><span class="pf" style="width:${it.prog}%;background:${it.col}"></span><span>${esc(it.label)}</span></button>`+marks;}).join('')}</div>`;
  });
  h+=`<div class="gov">${t0>=S&&t0<=G_END?`<div class="today" style="left:${pos(t0)+50/N}%"><i>hôm nay</i></div>`:''}${MILES.map(m=>`<div class="ms" title="${esc(m.t)}: ${fdy(m.d)}" style="left:${pos(m.d)+50/N}%"></div>`).join('')}</div></div></div>
  <div class="legend"><span><i style="border-color:${INK}"></i>mốc hạn chưa xong</span><span><i class="f"></i>mốc đã xong</span><span style="color:var(--bad)">| hôm nay</span><span>◆ cột mốc chung của nhóm</span></div>`;
  return h;
}
const ganttLab=t=>t.id==='S1'?'Ch.1':t.id==='P1'?'Bìa, tóm tắt':t.id==='P2'?'Tài liệu TK':t.id==='P3'?'Phụ lục':t.id==='X1'?'Slide':t.id==='X2'?'Hỏi đáp':t.code;
const itemBar=(t,col,short)=>{const ds=t.keys.map(s=>t.dl[s[0]]).sort();const done=t.keys.filter(s=>t.ticks[s[0]]).length;
  return {id:t.id,s:ds[0],e:ds[ds.length-1],col:col,done:isDone(t),prog:isDone(t)?100:Math.round(done/Math.max(1,t.keys.length)*100),label:short?ganttLab(t):'',title:t.code+'. '+t.t+' ('+t.keys.map(s=>s[1]+' '+fd(t.dl[s[0]])).join(', ')+')',
   marks:t.keys.map(s=>({d:t.dl[s[0]],on:!!t.ticks[s[0]],t:s[1]+' '+fd(t.dl[s[0]])}))};};
function workloadHTML(ts){
  const maxPg=Math.max.apply(null,MEM_IDS.map(m=>ts.filter(t=>t.o===m).reduce((a,t)=>a+t.pg,0)).concat([1]));
  return MEM_IDS.map(m=>{const l=ts.filter(t=>t.o===m),pg=l.reduce((a,t)=>a+t.pg,0),pd2=pgDone(l);
    return `<div class="wl"><span>${chipM(m)}</span><div class="wlb" title="${fmtPg(pg)} trang"><i style="width:${pd2/maxPg*100}%;background:${MEM[m].acc}"></i><i style="width:${(pg-pd2)/maxPg*100}%;background:${MEM[m].soft}"></i></div><span class="small"><b>${fmtPg(pd2)}</b>/${fmtPg(pg)} trang</span></div>`;}).join('');
}

  else if(a==='opennotif'){const nid=el.dataset.id;if(D.notifs[nid]&&!D.notifs[nid].read)put('notifs',nid,{read:true});UI.panel=false;renderPanel();if(el.dataset.item&&BASE_I[el.dataset.item])openItem(el.dataset.item);}
  else if(a==='open'){openItem(id);}
  else if(a==='pillar'){openPillar(el.dataset.k);}
  else if(a==='struct'){openStruct();}
  else if(a==='closemodal'){closeModal();render();}
  else if(a==='confirmyes'){const y=UI.confirm;closeModal();if(y)y();}
  else if(a==='askok'){const v=(($('#ask-t')||{}).value||'').trim();const cb=UI.askcb;if(!v){toast('Hãy viết lý do.');return;}closeModal();if(cb)await cb(v);}
  else if(a==='acct'){openAcct();}
  else if(a==='logout'){MUST=false;closeModal();await doLogout();}
  else if(a==='chpw'){
    const o=($('#pw-o')||{}).value||'',n=($('#pw-n')||{}).value||'',msg=$('#pw-msg');
    if(n.length<8){msg.textContent='Mật khẩu mới cần ít nhất 8 ký tự.';msg.style.color='var(--bad)';return;}
    const r=await Api.pw(o,n);
    if(r.error){msg.textContent=r.error==='bad'?'Mật khẩu hiện tại chưa đúng.':'Chưa đổi được. Thử lại.';msg.style.color='var(--bad)';return;}
    msg.textContent='Đã đổi mật khẩu.';msg.style.color='var(--ok)';$('#pw-o').value='';$('#pw-n').value='';
    if(MUST){MUST=false;setTimeout(()=>{closeModal();render();afterLogin();},700);}
  }
  else if(a==='resetpw'){const m=el.dataset.m;const r=await Api.resetpw(m);const o=$('#rs-msg');if(o)o.innerHTML=r.ok?'Mật khẩu tạm của <b>'+esc(MEM[m].n)+'</b> (hiện một lần, gửi riêng cho bạn ấy): <b style="font-family:monospace;font-size:17px">'+esc(r.pw)+'</b>':'Chưa đặt lại được.';}
  else if(a==='gochap'){UI.openC[el.dataset.c]=true;UI.tab='team';UI.cf=el.dataset.c;UI.view='list';UI.flt='all';saveUI();render();window.scrollTo({top:0});}
  else if(a==='view'){UI.view=el.dataset.v;saveUI();render();}
  else if(a==='checkin'){const t=(($('#ci-t')||{}).value||'').trim();await put('learn',ME,{note:t,help:!!($('#ci-h')||{}).checked,noteAt:nowISO()});UI.ci=undefined;toast('Đã lưu. Cả nhóm sẽ thấy ở trang Tổng quan.');}
  else if(a==='fwt'){UI.fw=!UI.fw;render();}
  else if(a==='glt'){UI.gl=!UI.gl;render();}
  else if(a==='flt'){UI.flt=el.dataset.v;render();}
  else if(a==='chapt'){const c=el.dataset.c;UI.openC[c]=!UI.openC[c];render();}
  else if(a==='tick'){await actTick(id,el.dataset.k);}
  else if(a==='chk'){const d=DR(UI.modal);const c=d.checks||(d.checks=[false,false,false]);c[+el.dataset.i]=el.checked;const b=$('#btn-submit');if(b){b.disabled=!c.every(Boolean);const h=$('#subhint');if(h)h.textContent=c.every(Boolean)?'':'Tick đủ 3 ô để nộp.';}}
  else if(a==='mention'){const d=DR(UI.modal);const ms=d.mentions||(d.mentions=[]);const m=el.dataset.m;const i=ms.indexOf(m);if(i>=0)ms.splice(i,1);else ms.push(m);el.classList.toggle('on',i<0);}
  else if(a==='submit'){const link=($('#f-link')||{}).value||'',note=($('#f-note')||{}).value||'';const ok=await actSubmit(id,link.trim(),note.trim());if(ok){delete UI.draft[id];openItem(id,true);}}
  else if(a==='checkok'){const ok=await actCheck(id,true);if(ok)openItem(id,true);}
  else if(a==='checkfix'){const r=(($('#f-cm')||{}).value||'').trim();const ok=await actCheck(id,false,r);if(ok){DR(id).cm='';openItem(id,true);}}
  else if(a==='apok'){await actApprove(id,true);openItem(id,true);}
  else if(a==='apfix'){const r=(($('#f-cm')||{}).value||'').trim();const ok=await actApprove(id,false,r);if(ok){DR(id).cm='';openItem(id,true);}}
  else if(a==='reopen'){await put('items',id,{status:'doing'});}
  else if(a==='start'){await put('items',id,{status:'doing'});}
  else if(a==='savedl'){const dl={};$$('.f-dl').forEach(x=>dl[x.dataset.k]=x.value);await actDates(id,dl,($('#f-dueok')||{}).checked);toast('Đã lưu hạn.');}
  else if(a==='sendcm'){const tx=(($('#f-cm')||{}).value||'').trim();if(!tx){toast('Hãy viết nội dung bình luận.');return;}const ms=DR(id).mentions||[];await postComment(id,tx,ms);const d=DR(id);d.cm='';d.mentions=[];openItem(id,true);}
  else if(a==='ping'){await actPing(id,(($('#f-cm')||{}).value||'').trim());}
  else if(a==='sview'){UI.sv=el.dataset.v;render();}
  else if(a==='sfl'){UI.sfl=el.dataset.v;render();}
  else if(a==='savelink'){const k=el.dataset.k;const u=(($('#lk-'+k)||{}).value||'').trim();if(u&&!/^https:\/\//i.test(u)){toast('Link phải bắt đầu bằng https://');return;}await put('links',k,{url:u,at:nowISO()});toast('Đã lưu link.');}
  else if(a==='addlink'){const t=($('#nl-t').value||'').trim(),u=($('#nl-u').value||'').trim();if(!t||!/^https:\/\//i.test(u)){toast('Nhập tên file và link bắt đầu bằng https://');return;}await put('links','x'+Date.now().toString(36),{title:t,url:u,at:nowISO()});toast('Đã thêm.');}
  else if(a==='addsrc'){const v=k=>(($('#ns-'+k)||{}).value||'').trim();const l=v('l');if(!v('t')||!/^https:\/\//i.test(l)){toast('Nhập tên bài và link đã mở (bắt đầu bằng https://).');return;}await put('sources','x'+Date.now().toString(36),{a:v('a')||'(chưa rõ tác giả)',y:v('y')||'—',t:v('t'),v:v('v'),use:'',st:'ok',link:l,at:nowISO(),custom:true});toast('Đã thêm nguồn.');}
  else if(a==='setdl'){const v=($('#dlin')||{}).value;if(!v){toast('Chọn ngày trước.');return;}await put('settings','main',{deadline:v});toast('Đã lưu hạn nộp.');}
  else if(a==='cldl'){await put('settings','main',{deadline:''});}
  else if(a==='mt'){UI.mopen[id]=!UI.mopen[id];const b=$('#mod-'+id);if(b){b.classList.toggle('open',!!UI.mopen[id]);el.setAttribute('aria-expanded',!!UI.mopen[id]);}}
  else if(a==='lstep'){const L=D.learn[ME]||{};const m=LEARN.find(x=>x.id===id);const arr=m.steps.map((_,i)=>!!(L['s_'+id]||[])[i]);arr[+el.dataset.i]=!arr[+el.dataset.i];await put('learn',ME,{['s_'+id]:arr});}
  else if(a==='ldone'){const L=D.learn[ME]||{};await put('learn',ME,{['d_'+id]:!L['d_'+id]});}
  else if(a==='llang'){UI.mlang[id]=el.dataset.l;const m=LEARN.find(x=>x.id===id);const p=$('#code-'+id);if(p)p.firstElementChild.textContent=m.code[el.dataset.l];$$('[data-act=llang][data-id='+id+']').forEach(b=>b.classList.toggle('on',b.dataset.l===el.dataset.l));}
  else if(a==='lcopy'){const m=LEARN.find(x=>x.id===id);clip(m.code[UI.mlang[id]||'R']||m.code[Object.keys(m.code)[0]]);}
});
document.addEventListener('change',async e=>{
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;const id=el.dataset.id;
  if(f==='sst'){await put('sources',id,{st:el.value});}
  else if(f==='slk'){const v=el.value.trim();if(v&&!/^https:\/\//i.test(v)){toast('Link phải bắt đầu bằng https://');return;}await put('sources',id,{link:v});}
  else if(f==='cf'){UI.cf=el.value;render();}
});
document.addEventListener('change',e=>{if(e.target.id==='ci-h'){UI.ci=UI.ci||{};UI.ci.h=e.target.checked;}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='f-link'&&UI.modal)DR(UI.modal).link=el.value;
  else if(el.id==='f-note'&&UI.modal)DR(UI.modal).note=el.value;
  else if(el.id==='f-cm'&&UI.modal)DR(UI.modal).cm=el.value;
  else if(el.id==='ci-t'){UI.ci=UI.ci||{};UI.ci.t=el.value;}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#ov').classList.contains('on')){closeModal();render();}else if(UI.panel){UI.panel=false;renderPanel();}}
  if(e.key==='Enter'&&(e.target.id==='lg-p'||e.target.id==='lg-u'))tryLogin();
});
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov'&&!['confirm','ask'].includes(UI.modal)){closeModal();render();}});

/* ---------- kéo thả (chuột và cảm ứng) ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.kc');if(!c||e.button>0)return;
  if(e.pointerType==='touch'&&!e.target.closest('.grip'))return;
  drag={id:c.dataset.id,x:e.clientX,y:e.clientY,el:c,started:false,ghost:null,over:null};
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;
    drag.started=true;drag.el.classList.add('dragging');
    const g=drag.el.cloneNode(true);g.classList.remove('dragging');g.classList.add('ghost');g.removeAttribute('data-id');document.body.appendChild(g);drag.ghost=g;
  }
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-100)+'px';drag.ghost.style.top=(e.clientY-20)+'px';
  const under=document.elementFromPoint(e.clientX,e.clientY);const col=under&&under.closest?under.closest('.kcol'):null;
  if(drag.over&&drag.over!==col)drag.over.classList.remove('over');
  if(col)col.classList.add('over');drag.over=col;
  const b=$('#board');if(b){const r=b.getBoundingClientRect();if(e.clientX>r.right-50)b.scrollLeft+=14;else if(e.clientX<r.left+50)b.scrollLeft-=14;}
  if(e.clientY>window.innerHeight-60)window.scrollBy(0,14);else if(e.clientY<60)window.scrollBy(0,-14);
},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;
  if(d.started){
    justDragged=true;setTimeout(()=>{justDragged=false;},350);
    d.el.classList.remove('dragging');if(d.ghost)d.ghost.remove();if(d.over)d.over.classList.remove('over');
    if(!cancel&&d.over){requestMove(d.id,d.over.dataset.s);}
    render();
  }
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ---------- khởi động ---------- */
async function detect(){
  if(location.protocol==='file:')return 'local';
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch('/api/ping',{signal:ctl.signal});clearTimeout(to);
    const j=await r.json();if(j&&j.ok===true){BACKEND_READY=!!j.ready;return 'remote';}
  }catch(e){}
  return 'local';
}
async function boot(){
  renderNow();
  const m=await detect();MODE=m;Api=m==='remote'?RemoteApi:LocalApi;
  if(m==='remote'){
    try{const t=localStorage.getItem('nckh_tok');if(t){Api.tok=t;const r=await Api.state('','');if(r&&!r.error){try{ME=JSON.parse(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).m;}catch(e){ME=null;}if(!MEM[ME])ME=null;}else{Api.tok=null;localStorage.removeItem('nckh_tok');}}}catch(e){}
  }else{
    try{const m2=localStorage.getItem('nckh_tok_local');if(m2&&MEM[m2]){ME=m2;LocalApi.me=m2;Api.tok='local.'+m2;}}catch(e){}
  }
  ready=true;
  if(ME){await sync();startPoll();setTimeout(()=>{const au=autoReminders();if(au.length)toast('Nhắc việc: bạn có '+au.length+' mục sắp đến hạn hoặc trễ hạn.');},700);}
  renderNow();
}
boot();
